spring:
  application:
    name: nmit-confessions
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/confessions}
    username: ${DB_USERNAME:confessions_user}
    password: ${DB_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: ${SESSION_COOKIE_SAMESITE:none}
