version: '3.8'
services:
  db:
    image: postgres:14-alpine
    container_name: nmit_confessions_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-confessions}
      POSTGRES_USER: ${POSTGRES_USER:-confessions_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-confessions_user} -d ${POSTGRES_DB:-confessions}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: .
    container_name: nmit_confessions_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-confessions}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-confessions_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      APP_DISCOVERY_TIMEZONE: ${APP_DISCOVERY_TIMEZONE:-Asia/Kolkata}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
