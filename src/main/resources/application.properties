spring.application.name=nmit-confessions

# Default to H2 for development/testing if not specified
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:SA}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# Spring Boot auto-detects driver-class-name from the JDBC URL

# JPA Settings
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# Moderation Settings
app.report.hide-threshold=${APP_REPORT_HIDE_THRESHOLD:5}
app.report.rate-limit=${APP_REPORT_RATE_LIMIT:20}
app.report.rate-window-seconds=${APP_REPORT_RATE_WINDOW_SECONDS:3600}
app.trending.window-days=${APP_TRENDING_WINDOW_DAYS:7}
app.discovery.timezone=${APP_DISCOVERY_TIMEZONE:Asia/Kolkata}

# CORS Origin
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Server
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Logging Configuration
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [%X{requestId}] - %msg%n

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
